name: Lanpixo iOS validation
on:
  workflow_dispatch:
    inputs:
      screenshots:
        description: Boot iPhone/iPad simulators and capture launch screens
        type: boolean
        default: false
  push:
    paths: ['ios/**', 'scripts/ios-simulator-smoke.py', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'scripts/ios-simulator-smoke.py', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Core subnet and CSV tests
        working-directory: ios
        run: swift test
      - name: Build iPhone and iPad simulator app
        run: >-
          xcodebuild -project ios/Lanpixo.xcodeproj -scheme Lanpixo
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - name: Build device binary without signing
        run: >-
          xcodebuild -project ios/Lanpixo.xcodeproj -scheme Lanpixo
          -configuration Release -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath ios/build-device CODE_SIGNING_ALLOWED=NO build
      - name: Launch on iPhone and iPad simulators
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        timeout-minutes: 12
        run: python3 scripts/ios-simulator-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lanpixo-iOS-simulator-screenshots
          path: ios/qa/simulator
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Lanpixo-iOS-simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/Lanpixo.app
          retention-days: 7
