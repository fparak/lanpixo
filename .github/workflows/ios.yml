name: Lanpixo iOS validation
on:
  workflow_dispatch:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Core subnet and CSV tests
        working-directory: ios
        run: swift test
      - name: Build iPhone and iPad simulator app
        run: >-
          xcodebuild -project ios/Lanpixo.xcodeproj -scheme Lanpixo
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - name: Build device binary without signing
        run: >-
          xcodebuild -project ios/Lanpixo.xcodeproj -scheme Lanpixo
          -configuration Release -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath ios/build-device CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: Lanpixo-iOS-simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/Lanpixo.app
          retention-days: 7
